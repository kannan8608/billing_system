<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Billing System{% endblock %}</title>
  <style>
    /* Intentionally minimal styling per the task's "no need for fancy CSS" note. */
    body { font-family: Arial, Helvetica, sans-serif; max-width: 900px; margin: 30px auto; color: #222; }
    h1 { text-align: center; font-size: 20px; border-bottom: 1px solid #999; padding-bottom: 10px; }
    table { border-collapse: collapse; width: 100%; margin: 10px 0; }
    th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; font-size: 14px; }
    th { background: #f2f2f2; }
    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
    label { display: inline-block; min-width: 140px; }
    input[type=text], input[type=email], input[type=number] { padding: 5px; width: 220px; }
    button { padding: 6px 14px; cursor: pointer; }
    .btn-primary { background: #4caf50; color: white; border: none; }
    .btn-secondary { background: #eee; border: 1px solid #ccc; }
    .section { margin: 20px 0; padding-top: 10px; border-top: 1px solid #ddd; }
    .totals { text-align: right; margin: 15px 0; }
    .totals div { margin: 3px 0; }
    .error { color: #b00020; margin: 10px 0; }
    .muted { color: #777; font-size: 13px; }
    a { color: #1a73e8; }
  </style>
</head>
<body>
  <h1>Billing Page</h1>
  {% block content %}{% endblock %}
</body>
</html>
